<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body{% if embed %} class="embed"{% endif %}>
  {% if not embed %}
  <header class="topbar">
    <a class="brand" href="/">{{ app_name }}</a>
    <nav class="nav">
      <a href="/" {% if page == 'settings' %}aria-current="page"{% endif %}>Настройки</a>
      <a href="/weather" {% if page == 'weather' %}aria-current="page"{% endif %}>Погода</a>
      <a href="/notes" {% if page == 'notes' %}aria-current="page"{% endif %}>Записки</a>
      <a href="/people" {% if page == 'people' %}aria-current="page"{% endif %}>Люди</a>
      <a href="/integrations" {% if page == 'integrations' %}aria-current="page"{% endif %}>Интеграции</a>
    </nav>
  </header>
  {% endif %}
  <main class="container{% if embed %} embed{% endif %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
